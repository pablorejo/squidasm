# Perfect 3 node network with fuente central para repartir el par EPR
stacks:
  - name: Source
    qdevice_typ: generic
    qdevice_cfg:
      dummy: null
  - name: Alice
    qdevice_typ: generic
    qdevice_cfg:
      dummy: null
  - name: Bob
    qdevice_typ: generic
    qdevice_cfg:
      dummy: null

links:
  - stack1: Source
    stack2: Alice
    typ: perfect
  - stack1: Source
    stack2: Bob
    typ: perfect

clinks:
  - stack1: Source
    stack2: Alice
    typ: instant
  - stack1: Source
    stack2: Bob
    typ: instant